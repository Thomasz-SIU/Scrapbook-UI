<div class="container mx-auto p-4">
  <div *ngIf="album" class="mb-6">
    <div class="flex justify-between items-start mb-4">
      <div>
        <h1 class="text-2xl font-bold">{{album.title}}</h1>
        <p class="text-gray-600">{{album.description}}</p>
      </div>
      <div class="flex space-x-3">
        <button [routerLink]="['/albums', album.id, 'edit']"
                class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600 flex items-center"
                [disabled]="!album.id">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
            <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
          </svg>
          Edit Album
        </button>
        <button [routerLink]="['/photos/new']"
                [queryParams]="{albumId: album.id}"
                class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 flex items-center"
                [disabled]="!album.id">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 3a1 1 0 00-1 1v5H4a1 1 0 100 2h5v5a1 1 0 102 0v-5h5a1 1 0 100-2h-5V4a1 1 0 00-1-1z" clip-rule="evenodd" />
          </svg>
          Add Photos
        </button>
      </div>
    </div>
  </div>

  <!-- Debug info -->
  <div *ngIf="photos.length === 0" class="text-gray-600 mb-4">
    No photos found in this album
  </div>

  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
    <div *ngFor="let photo of photos" class="relative group">
      <img [src]="getImageUrl(photo)"
           [alt]="photo.title"
           class="w-full h-48 object-cover rounded-lg bg-gray-100">

      <!-- Debug info -->
      <div class="text-xs text-gray-500 mt-1">
        Photo ID: {{photo.id}}
      </div>

      <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-50 transition-opacity flex items-center justify-center opacity-0 group-hover:opacity-100">
        <div class="text-white text-center p-4">
          <h3 class="font-semibold">{{photo.title}}</h3>
          <p class="text-sm">{{photo.description}}</p>
          <button (click)="downloadPhoto(photo)"
                  class="mt-2 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
                  [disabled]="!photo.id">
            Download
          </button>
        </div>
      </div>
    </div>
  </div>

  <button *ngIf="photos.length >= pageSize && album?.id"
          (click)="loadMore()"
          class="mt-4 bg-gray-500 text-white px-6 py-2 rounded hover:bg-gray-600">
    Load More
  </button>
</div>
